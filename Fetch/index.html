<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pokemon Fetcher</title>
</head>
<body>
    <input type="text" id="pokemonName" placeholder="Enter pokemon name (e.g. pikachu)">
    <button onclick="fetchData()">Fetch Pokemon</button>
    <br><br>
    
    <!-- This ID must EXACTLY match the JS -->
    <img id="pokemanSprite" style="display:none;" alt="Pokemon Sprite">

    <!-- Place script at the bottom so DOM loads first -->
    <script src="index.js"></script>
</body>
</html>
